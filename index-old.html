<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>あしぶみレーサー 4人対戦</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,"Noto Sans JP",sans-serif;background:#111;color:#fff}
button,input{font:inherit}
#app{min-height:100vh;background:linear-gradient(#75c9f5 0 52%,#77c85b 52%);overflow:hidden}
header{padding:12px 20px;text-align:center;background:#111c;position:relative;z-index:10}
h1{margin:0;font-size:clamp(28px,4vw,48px)}
#race{position:relative;height:55vh;min-height:360px;overflow:hidden;border-bottom:5px solid #222}
#world{position:absolute;left:0;top:0;height:100%;width:100000px;transition:left .65s cubic-bezier(.2,.8,.2,1)}
.ground{position:absolute;left:0;right:0;top:52%;bottom:0;background:
 repeating-linear-gradient(0deg,#77c85b 0 35px,#66b94d 35px 38px),
 repeating-linear-gradient(90deg,transparent 0 140px,#ffffff22 140px 145px)}
.distance-line{position:absolute;top:52%;height:48%;border-left:4px solid #fff8}
.distance-label{position:absolute;top:53%;transform:translateX(-50%);font-weight:900;background:#222b;padding:4px 8px;border-radius:8px}
.player{
 position:absolute;left:20px;width:190px;height:110px;display:flex;align-items:center;
 transition:transform .65s cubic-bezier(.2,.8,.2,1);z-index:3
}
.player img{width:150px;height:105px;object-fit:contain;filter:drop-shadow(0 6px 3px #0007)}
.pname{position:absolute;left:0;top:-5px;background:#111d;padding:4px 8px;border-radius:8px;font-weight:900}
#p1{top:2%}#p2{top:27%}#p3{top:52%}#p4{top:77%}
#controls{background:#f5f5f5;color:#111;padding:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.control{border:3px solid #222;border-radius:16px;padding:10px;background:#fff}
.control h2{margin:0 0 7px;font-size:20px}
.control input[type=number]{width:100%;padding:8px;border:2px solid #333;border-radius:9px;font-size:22px;text-align:center}
.control button,.mainbtn{width:100%;margin-top:7px;padding:9px;border:0;border-radius:10px;background:#222;color:#fff;font-weight:900;cursor:pointer}
.upload{font-size:13px;margin-top:7px;width:100%}
.stat{font-weight:900;margin-top:5px}
#motionPanel{background:#eaf7ff;color:#111;padding:12px 14px;border-top:3px solid #222;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
#motionPanel select,#motionPanel button{padding:9px 12px;border:2px solid #222;border-radius:10px;font-weight:900}
#motionStatus{font-weight:900}#motionDebug{font-size:13px;font-weight:700;opacity:.8}
#bottom{background:#111;color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.mainbtn{width:auto;margin:0;padding:10px 18px;background:#fff;color:#111}
#message{font-size:18px;font-weight:900}
.fullscreen #controls{display:none}
.fullscreen header{display:none}
.fullscreen #race{height:100vh;border:0}
@media(max-width:800px){
 #controls{grid-template-columns:1fr 1fr}
 .player{width:150px}.player img{width:120px}
}
</style>
</head>
<body>
<div id="app">
<header><h1>🏃 あしぶみレーサー</h1></header>

<section id="race">
  <div id="world">
    <div class="ground"></div>
    <div id="markers"></div>

    <div class="player" id="p1"><span class="pname">プレイヤー1</span><img id="img1"></div>
    <div class="player" id="p2"><span class="pname">プレイヤー2</span><img id="img2"></div>
    <div class="player" id="p3"><span class="pname">プレイヤー3</span><img id="img3"></div>
    <div class="player" id="p4"><span class="pname">プレイヤー4</span><img id="img4"></div>
  </div>
</section>

<section id="controls">
  <div class="control">
    <h2>🟢 プレイヤー1</h2>
    <input id="steps1" type="number" min="0" placeholder="歩数">
    <button onclick="addSteps(1)">▶ 進む</button>
    <input class="upload" type="file" accept="image/*" onchange="loadImage(1,this)">
    <div class="stat" id="total1">0歩 / 0.0m</div>
  </div>
  <div class="control">
    <h2>🔴 プレイヤー2</h2>
    <input id="steps2" type="number" min="0" placeholder="歩数">
    <button onclick="addSteps(2)">▶ 進む</button>
    <input class="upload" type="file" accept="image/*" onchange="loadImage(2,this)">
    <div class="stat" id="total2">0歩 / 0.0m</div>
  </div>
  <div class="control">
    <h2>🟡 プレイヤー3</h2>
    <input id="steps3" type="number" min="0" placeholder="歩数">
    <button onclick="addSteps(3)">▶ 進む</button>
    <input class="upload" type="file" accept="image/*" onchange="loadImage(3,this)">
    <div class="stat" id="total3">0歩 / 0.0m</div>
  </div>
  <div class="control">
    <h2>🩷 プレイヤー4</h2>
    <input id="steps4" type="number" min="0" placeholder="歩数">
    <button onclick="addSteps(4)">▶ 進む</button>
    <input class="upload" type="file" accept="image/*" onchange="loadImage(4,this)">
    <div class="stat" id="total4">0歩 / 0.0m</div>
  </div>
</section>

<section id="motionPanel">
  <strong>📱 自動歩数</strong>
  <label>歩く人：
    <select id="motionPlayer">
      <option value="1">プレイヤー1</option>
      <option value="2">プレイヤー2</option>
      <option value="3">プレイヤー3</option>
      <option value="4">プレイヤー4</option>
    </select>
  </label>
  <button id="motionBtn" onclick="startMotion()">▶ 自動カウント開始</button>
  <button onclick="stopMotion()">■ 停止</button>
  <button onclick="diagnoseMotion()">🔎 センサー診断</button>
  <span id="motionStatus">停止中</span>
  <span id="motionDebug">イベント: 0 / 加速度: --</span>
</section>

<div id="bottom">
  <span id="message">画像を選択して、歩数を入力！</span>
  <button class="mainbtn" onclick="resetGame()">🔄 リセット</button>
  <button class="mainbtn" onclick="toggleFullscreen()">⛶ 全画面</button>
</div>
</div>

<script>
const state=[0,0,0,0];
const colors=["🟢","🔴","🟡","🩷"];
const STEP_M=0.7;       // 1歩 = 0.7m
const PX_PER_M=5;       // 1mあたりの画面上の移動量
const BASE_X=20;

function addSteps(n){
  const input=document.getElementById("steps"+n);
  const steps=Math.floor(Number(input.value));
  if(!Number.isFinite(steps)||steps<=0){input.focus();return}
  state[n-1]+=steps;
  updatePlayer(n);
  input.value="";
  const meters=state[n-1]*STEP_M;
  document.getElementById("message").textContent=
    `${colors[n-1]} プレイヤー${n}：${meters.toFixed(1)}m地点まで進みました！`;
}

function updateCamera(){
  const maxM=Math.max(...state)*STEP_M;
  const race=document.getElementById("race");
  const viewCenter=race.clientWidth*0.42;
  const camera=Math.max(0,maxM*PX_PER_M-viewCenter);
  document.getElementById("world").style.left=(-camera)+"px";
  drawMarkers(camera);
}

function drawMarkers(camera){
  const markers=document.getElementById("markers");
  const start=Math.max(0,Math.floor(camera/PX_PER_M/50)*50-50);
  let s="";
  for(let m=start;m<start+Math.ceil(window.innerWidth/PX_PER_M)+150;m+=50){
    const x=m*PX_PER_M;
    s+=`<div class="distance-line" style="left:${x}px"></div>`;
    s+=`<div class="distance-label" style="left:${x}px">${m}m</div>`;
  }
  markers.innerHTML=s;
}

function loadImage(n,input){
  const file=input.files[0];
  if(!file)return;
  const url=URL.createObjectURL(file);
  const img=document.getElementById("img"+n);
  img.src=url;
  img.onload=()=>URL.revokeObjectURL(url);
}


let motionRunning=false;
let motionPermissionGranted=false;
let motionListener=null;
let motionEvents=0;
let motionTestTimer=null;
let motionLast=0;
let signalMean=0;
let signalPrev=0;
let signalHigh=false;
let motionCooldownUntil=0;

function setMotionStatus(text){
  document.getElementById("motionStatus").textContent=text;
}

function setMotionDebug(){
  const el=document.getElementById("motionDebug");
  const acc=el.dataset.acc || "--";
  el.textContent=`イベント: ${motionEvents} / 加速度: ${acc}`;
}

function setDebugAcceleration(value){
  const el=document.getElementById("motionDebug");
  el.dataset.acc=value;
  setMotionDebug();
}

async function getMotionPermission(){
  if(typeof DeviceMotionEvent==="undefined"){
    return {ok:false,reason:"unsupported"};
  }

  if(typeof DeviceMotionEvent.requestPermission==="function"){
    try{
      const result=await DeviceMotionEvent.requestPermission();
      if(result!=="granted") return {ok:false,reason:result};
      return {ok:true,reason:"granted"};
    }catch(e){
      return {ok:false,reason:"error",error:e};
    }
  }

  // Browsers without requestPermission can attach the listener directly.
  return {ok:true,reason:"not-required"};
}

function resetMotionDetector(){
  motionEvents=0;
  motionLast=0;
  signalMean=0;
  signalPrev=0;
  signalHigh=false;
  motionCooldownUntil=0;
  setDebugAcceleration("--");
  setMotionDebug();
}

async function startMotion(){
  if(motionRunning){
    setMotionStatus("すでに自動カウント中です 🚶");
    return;
  }

  resetMotionDetector();
  setMotionStatus("センサーの許可を確認中…");

  const permission=await getMotionPermission();
  if(!permission.ok){
    if(permission.reason==="unsupported"){
      setMotionStatus("このSafariでは動きセンサーが使えません");
    }else if(permission.reason==="denied"){
      setMotionStatus("センサーが拒否されています。Safariの設定を確認してください");
    }else{
      setMotionStatus("センサーの許可が必要です（もう一度試してください）");
    }
    return;
  }

  motionPermissionGranted=true;
  motionRunning=true;
  motionListener=handleMotion;
  window.addEventListener("devicemotion",motionListener,{passive:true});
  document.getElementById("motionBtn").textContent="● 自動カウント中";
  setMotionStatus("センサー許可OK。歩いてみてください 🚶");

  // If Safari gives us no events, explain that instead of silently looking stopped.
  clearTimeout(motionTestTimer);
  motionTestTimer=setTimeout(()=>{
    if(motionRunning && motionEvents===0){
      setMotionStatus("センサーデータが届いていません。Safariで開いているか確認してください");
    }else if(motionRunning){
      setMotionStatus("歩数を検出中 🚶");
    }
  },1800);
}

function stopMotion(){
  if(motionListener){
    window.removeEventListener("devicemotion",motionListener);
    motionListener=null;
  }
  clearTimeout(motionTestTimer);
  motionRunning=false;
  document.getElementById("motionBtn").textContent="▶ 自動カウント開始";
  setMotionStatus("停止中");
  setMotionDebug();
}

function diagnoseMotion(){
  if(typeof DeviceMotionEvent==="undefined"){
    setMotionStatus("❌ DeviceMotionEventが利用できません");
    return;
  }
  setMotionStatus("🔎 センサー診断中… iPhoneを軽く動かしてください");
  const before=motionEvents;
  const listener=(e)=>{
    motionEvents++;
    const a=e.acceleration || e.accelerationIncludingGravity;
    if(a && a.x!=null && a.y!=null && a.z!=null){
      const mag=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z);
      setDebugAcceleration(mag.toFixed(2)+" m/s²");
    }
  };
  window.addEventListener("devicemotion",listener,{passive:true});
  setTimeout(()=>{
    window.removeEventListener("devicemotion",listener);
    if(motionEvents>before){
      setMotionStatus(`✅ センサーOK（約${motionEvents-before}件受信）`);
    }else{
      setMotionStatus("❌ センサーデータを受信できませんでした");
    }
  },2000);
}

function handleMotion(e){
  if(!motionRunning)return;
  motionEvents++;

  // Prefer gravity-free acceleration when Safari provides it.
  let a=e.acceleration;
  let usesGravityIncluded=false;
  if(!a || a.x==null || a.y==null || a.z==null){
    a=e.accelerationIncludingGravity;
    usesGravityIncluded=true;
  }
  if(!a || a.x==null || a.y==null || a.z==null)return;

  const raw=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z);
  setDebugAcceleration(raw.toFixed(2)+" m/s²");

  let signal=raw;
  if(usesGravityIncluded){
    // Estimate the slow gravity component when only total acceleration is available.
    signalMean=signalMean===0 ? raw : signalMean*0.92+raw*0.08;
    signal=Math.abs(raw-signalMean);
  }else{
    signalMean=signalMean===0 ? raw : signalMean*0.94+raw*0.06;
    signal=Math.abs(raw-signalMean);
  }

  const now=performance.now();
  if(motionLast===0){
    motionLast=now;
    signalPrev=signal;
    return;
  }

  // A simple peak detector. This is an estimate, not Health app step counting.
  const rise=signal>1.0 && signal>signalPrev;
  if(now>=motionCooldownUntil && rise){
    signalHigh=true;
  }

  if(signalHigh && signal<0.55 && signalPrev>=signal && now>=motionCooldownUntil){
    const player=Number(document.getElementById("motionPlayer").value);
    state[player-1]+=1;
    updatePlayer(player);
    signalHigh=false;
    motionCooldownUntil=now+300;
    setMotionStatus(`🚶 プレイヤー${player}: ${state[player-1]}歩`);
  }

  signalPrev=signal;
  motionLast=now;
}

function updatePlayer(n){
  const meters=state[n-1]*STEP_M;
  document.getElementById("total"+n).textContent=
    `${state[n-1]}歩 / ${meters.toFixed(1)}m`;
  const x=meters*PX_PER_M;
  document.getElementById("p"+n).style.transform=`translateX(${x}px)`;
  updateCamera();
  document.getElementById("message").textContent=
    `${colors[n-1]} プレイヤー${n}：${meters.toFixed(1)}m地点まで進みました！`;
}

function resetGame(){
  stopMotion();
  for(let i=0;i<4;i++){
    state[i]=0;
    document.getElementById("total"+(i+1)).textContent="0歩 / 0.0m";
    document.getElementById("steps"+(i+1)).value="";
    document.getElementById("p"+(i+1)).style.transform="translateX(0)";
  }
  document.getElementById("world").style.left="0px";
  document.getElementById("message").textContent="画像を選択して、歩数を入力！";
  updateCamera();
}

function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen?.();
    document.body.classList.add("fullscreen");
  }else{
    document.exitFullscreen?.();
    document.body.classList.remove("fullscreen");
  }
}
document.addEventListener("fullscreenchange",()=>{
  document.body.classList.toggle("fullscreen",!!document.fullscreenElement);
  updateCamera();
});
drawMarkers(0);
</script>
</body>
</html>
